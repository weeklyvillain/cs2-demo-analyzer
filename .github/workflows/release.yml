name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    # Pinned to windows-2022 (Visual Studio 2022): windows-latest now ships
    # Visual Studio 18, which node-gyp 10 cannot detect, so npm ci fails.
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extractor

      - name: Setup Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      - name: Get current version
        id: get_version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Current version: $version"
          echo "current_version=$version" >> $env:GITHUB_OUTPUT

      # A bump is needed when the tag for the current version already exists
      # on a different commit (that version was released from older code).
      # A tag pointing at this exact commit means "release this version as is".
      - name: Check if version bump is needed
        id: check_version
        run: |
          $currentVersion = "${{ steps.get_version.outputs.current_version }}"
          $tagSha = git rev-parse -q --verify "refs/tags/v$currentVersion^{commit}" 2>$null
          $headSha = git rev-parse HEAD
          if (-not $tagSha) {
            Write-Host "Tag v$currentVersion does not exist yet, releasing $currentVersion"
            echo "needs_bump=false" >> $env:GITHUB_OUTPUT
          } elseif ($tagSha -eq $headSha) {
            Write-Host "Tag v$currentVersion points at HEAD, releasing $currentVersion"
            echo "needs_bump=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Tag v$currentVersion is on another commit ($tagSha), bumping"
            echo "needs_bump=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      # Skips any version whose tag already exists, so a tag left behind by a
      # failed run can never block later releases.
      - name: Bump version (patch)
        if: steps.check_version.outputs.needs_bump == 'true'
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          do {
            npm version patch --no-git-tag-version | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $newVersion = (Get-Content package.json | ConvertFrom-Json).version
          } while (git rev-parse -q --verify "refs/tags/v$newVersion" 2>$null)
          git add package.json package-lock.json
          git commit -m "chore: bump version to $newVersion [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "New version: $newVersion"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "tag_name=v$newVersion" >> $env:GITHUB_OUTPUT

      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tagName = "v$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      # Pushes the bump commit and its tag atomically: either both land or
      # neither does. If master moved meanwhile, rebase onto it and retry.
      - name: Push version commit and tag
        if: steps.check_version.outputs.needs_bump == 'true'
        run: |
          $tagName = "${{ steps.bump_version.outputs.tag_name }}"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git tag -f -a "$tagName" -m "chore: bump version to $tagName [skip ci]"
            git push --atomic origin HEAD:refs/heads/master "refs/tags/${tagName}"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Push rejected (attempt $attempt), rebasing onto origin/master"
            git fetch origin master
            git rebase origin/master
            if ($LASTEXITCODE -ne 0) { git rebase --abort; exit 1 }
          }
          exit 1

      - name: Ensure tag exists for publishing
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tagName = "v$version"
          Write-Host "Checking for tag: $tagName"
          # Fetch tags to ensure we have the latest
          git fetch origin --tags
          # Verify tag exists
          if (git rev-parse "$tagName" >$null 2>&1) {
            Write-Host "Tag $tagName exists"
          } else {
            Write-Host "Tag $tagName does not exist, creating it"
            git tag "$tagName"
            git push origin "refs/tags/$tagName"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build demo extractor (Windows)
        run: npm run build:parser
      
      - name: Package Windows installer and publish
        run: |
          npm run build
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # electron-builder creates the GitHub release as a draft. Publish it once
      # the installer and latest.yml are uploaded, so the auto-updater never
      # sees a release with missing files.
      - name: Publish release
        run: gh release edit "${{ steps.version.outputs.tag_name }}" --repo "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    runs-on: macos-latest
    needs: release-windows
    permissions:
      contents: write

    steps:
      # Build the exact commit the Windows job released (it may have pushed a
      # version bump commit after this workflow was triggered).
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.release-windows.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: extractor

      - name: Install dependencies
        run: npm ci

      # EXPECTATION:
      # A separate tools repo publishes a macOS archive containing:
      #   resources/bin/mac/cs2-voice-extractor-mac-amd64, cs2-voice-extractor-mac-arm64,
      #   resources/bin/audiowaveform-mac-amd64, audiowaveform-mac-arm64,
      #   and any other required binaries.
      # This step should download and extract that archive into ./bin or ./resources/bin.
      - name: Download macOS voice and waveform tools
        run: |
          echo "TODO: replace this placeholder with a curl/actions/download-artifact step that fetches macOS binaries into the bin/ directory."

      - name: Build demo extractor (macOS)
        run: npm run build:parser

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(cat package.json | node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Ensure tag exists for publishing
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="v$VERSION"
          echo "Checking for tag: $TAG_NAME"
          git fetch origin --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME exists"
          else
            echo "Tag $TAG_NAME does not exist, creating it"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Package macOS build and publish
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npm run build
          npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
