name: Release

# Builds the native Windows app (native/), its NSIS installer and latest.yml, and
# publishes them as a GitHub release. Electron 1.0.x installs update from this feed
# too (see native/MIGRATION.md). Runs on every push to master; "Run workflow" can
# publish a pre-release instead, which update checks ignore (for testing).

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '**.md'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a pre-release (not offered as an update)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # The version lives in native/Cargo.toml. A bump is needed when the tag for the
      # current version already exists on a different commit (that version was released
      # from older code). A tag pointing at this exact commit means "release it as is".
      - name: Check if version bump is needed
        id: check_version
        run: |
          $currentVersion = python native/installer/version.py get
          $tagSha = git rev-parse -q --verify "refs/tags/v$currentVersion^{commit}" 2>$null
          $headSha = git rev-parse HEAD
          if (-not $tagSha) {
            Write-Host "Tag v$currentVersion does not exist yet, releasing $currentVersion"
            echo "needs_bump=false" >> $env:GITHUB_OUTPUT
          } elseif ($tagSha -eq $headSha) {
            Write-Host "Tag v$currentVersion points at HEAD, releasing $currentVersion"
            echo "needs_bump=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Tag v$currentVersion is on another commit ($tagSha), bumping"
            echo "needs_bump=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      # Next free patch version (skips tags left by failed runs), written to
      # native/Cargo.toml and native/Cargo.lock.
      - name: Bump version (patch)
        if: steps.check_version.outputs.needs_bump == 'true'
        id: bump_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $newVersion = python native/installer/version.py bump --apply
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git add native/Cargo.toml native/Cargo.lock
          git commit -m "chore: bump version to $newVersion [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "New version: $newVersion"
          echo "tag_name=v$newVersion" >> $env:GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          $version = python native/installer/version.py get
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag_name=v$version" >> $env:GITHUB_OUTPUT

      # Pushes the bump commit and its tag atomically: either both land or
      # neither does. Goes to the branch this run is for (master, or the branch
      # picked in "Run workflow"); if it moved meanwhile, rebase onto it and retry.
      - name: Push version commit and tag
        if: steps.check_version.outputs.needs_bump == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          $tagName = "${{ steps.bump_version.outputs.tag_name }}"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git tag -f -a "$tagName" -m "chore: bump version to $tagName [skip ci]"
            git push --atomic origin "HEAD:refs/heads/$env:BRANCH" "refs/tags/${tagName}"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Push rejected (attempt $attempt), rebasing onto origin/$env:BRANCH"
            git fetch origin "$env:BRANCH"
            git rebase "origin/$env:BRANCH"
            if ($LASTEXITCODE -ne 0) { git rebase --abort; exit 1 }
          }
          exit 1

      - name: Ensure tag exists for publishing
        run: |
          $tagName = "${{ steps.version.outputs.tag_name }}"
          git fetch origin --tags
          if (git rev-parse -q --verify "refs/tags/$tagName" 2>$null) {
            Write-Host "Tag $tagName exists"
          } else {
            Write-Host "Tag $tagName does not exist, creating it"
            git tag "$tagName"
            git push origin "refs/tags/$tagName"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build app
        working-directory: native
        run: cargo build --release --locked

      # NSIS ships with GitHub's Windows images; install it if an image ever drops it.
      - name: Ensure NSIS
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build installer and latest.yml
        run: python native/installer/build.py

      # gh uploads the assets before the release goes public, so update checks never
      # see a release without its installer. A re-run replaces the assets.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        run: |
          $tagName = "${{ steps.version.outputs.tag_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $assets = @("native/target/installer/CS2-Demo-Analyzer-Setup-$version.exe", "native/target/installer/latest.yml")
          gh release view "$tagName" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tagName exists, replacing its assets"
            gh release upload "$tagName" @assets --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            exit 0
          }
          $flags = @("--title", $version, "--generate-notes", "--verify-tag")
          if ($env:PRERELEASE -eq 'true') { $flags += "--prerelease" } else { $flags += "--latest" }
          gh release create "$tagName" @assets @flags --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
