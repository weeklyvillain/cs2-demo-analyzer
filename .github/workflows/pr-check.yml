name: PR Check

# Builds and tests the native app (native/) and the demo extractor on every pull
# request, and builds the installer the release would publish. Renovate only
# auto-merges dependency updates once this check passes, and a merge to master
# triggers the Release workflow.

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            extractor

      - name: Run demo extractor tests
        run: cargo test --locked --manifest-path extractor/Cargo.toml

      - name: Run app tests
        working-directory: native
        run: cargo test --release --locked

      - name: Build app
        working-directory: native
        run: cargo build --release --locked

      - name: Ensure NSIS
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build installer
        run: python native/installer/build.py
