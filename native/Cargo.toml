[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cs2da-core = { path = "crates/core" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
gpui-kit = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
