[package]
name = "cs2da"
description = "CS2 Demo Analyzer, native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cs2-demo-analyzer"
path = "src/main.rs"

[dependencies]
# Radar images for the 2D viewer (same major version GPUI uses).
image = { version = "0.25", default-features = false, features = ["png"] }
cs2da-core.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
dirs.workspace = true
serde_json.workspace = true
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# Overlay: window handle of the GPUI overlay window.
raw-window-handle = "0.6"

# Overlay: Win32 window tracking, click-through and hotkeys, in place of the Electron C++ addon.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
